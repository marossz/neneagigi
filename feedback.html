.hero h1{font:500 48px/1 "Playfair Display",Georgia,serif;margin:0 0 12px;letter-spacing:1px}
.hero p{margin:0;font:500 12px Poppins,system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase}
.sheet{padding:22px 20px 28px}
.top{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px}
.top img{height:62px;width:auto}
h2{font:700 29px/1.1 "Noto Serif",Georgia,serif;margin:0}
h3{font:700 22px/1.2 "Noto Serif",Georgia,serif;margin:26px 0 8px}
.bar{width:130px;height:6px;background:var(--ink);margin:12px 0 18px}
.lead{margin:0 0 18px;font-size:14px}
.opt{display:block;width:100%;min-height:56px;margin-bottom:10px;padding:0 16px;border:1.5px solid var(--ink);background:none;color:var(--ink);font:700 18px "Noto Serif",Georgia,serif;text-align:left;cursor:pointer}
.opt.on,.sc button.on{background:var(--ink);color:var(--paper)}
.dish{padding:10px 0 12px;border-top:1px solid var(--mut)}
.dish b{display:block;margin-bottom:8px;font-weight:400;font-size:13.5px;text-transform:uppercase;letter-spacing:.2px}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc button{min-height:44px;border:1.5px solid var(--ink);background:none;color:var(--ink);font:700 16px "Noto Serif",Georgia,serif;cursor:pointer}
textarea{width:100%;min-height:90px;margin:16px 0;padding:12px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font:15px "Noto Serif",Georgia,serif;resize:vertical}
.btn{width:100%;min-height:56px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font:700 18px "Noto Serif",Georgia,serif;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);margin-top:18px}
.pw{text-align:center;color:var(--mut);font-size:12px;margin:16px 0 0}
.offer{background:var(--grey);padding:16px;margin-top:22px;font-size:13.5px}
.offer h4{font:700 20px "Noto Serif",Georgia,serif;margin:0 0 8px;text-transform:uppercase}
.offer b{display:block;text-transform:uppercase;font-size:13px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 4px}
.kp div{border-top:6px solid var(--ink);padding-top:6px}
.kp b{font:700 40px/1.1 "Noto Serif",Georgia,serif;display:block}.kp small{color:var(--mut);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:8px;height:84px;margin:6px 0 4px}
.bars i{flex:1;background:var(--mut);opacity:.4}.bars i:last-child{background:var(--accent);opacity:1}
.lbl{display:flex;gap:8px;color:var(--mut);font-size:12px}.lbl span{flex:1;text-align:center}
.rv{padding:12px 0;border-top:1px solid var(--mut)}
.rv .t{font-size:12.5px;color:var(--mut);margin-bottom:3px}
.tag{font-weight:700;text-transform:uppercase;color:var(--ink)}.tag.bad{color:var(--bad)}
.rv button{margin-top:8px;border:1.5px solid var(--ink);background:none;color:var(--ink);padding:6px 10px;font:500 12.5px Poppins,system-ui,sans-serif;cursor:pointer}
.rv.done{opacity:.55}
.dr{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}.dr span:first-child{flex:0 0 48%;text-transform:uppercase}
.dr em{flex:1;height:10px;background:var(--grey)}.dr em i{display:block;height:100%;background:var(--accent)}
.dr b{width:34px;text-align:right}
.lock{border:1.5px dashed var(--mut);padding:14px;color:var(--mut);font-size:13.5px}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sc button{border:0!important;background:none!important;font-size:34px;line-height:1;min-height:48px;color:var(--accent,var(--brand,var(--ink)))}
</style>
</head>

function seg(id,o,cur,fn){$(id).innerHTML=o.map(x=>`<button class="${x[0]==cur?'on':''}" onclick="${fn}('${x[0]}')">${x[1]}</button>`).join('')}
function ctl(t){seg('#cv',[['guest',t.v1],['mgr',t.v2]],S.view,'sv');seg('#ct',[[1,'Standard'],[3,'Custom']],S.tier,'st');seg('#cl',[['ro','RO'],['en','EN']],S.lang,'sl')}
function sv(v){S.view=v;draw()}function st(t){S.tier=+t;draw()}function sl(l){S.lang=l;draw()}
function pick(k){S.r=k;draw()}function rate(i,n){S.sc[i]=n;draw()}

function reset(){S.r=null;S.sc={};S.txt='';S.step='rate';draw()}

 let dishes='';
 if(S.tier==3){dishes=`<h3>${t.dq}</h3>`;[0,1].forEach(g=>{dishes+=`<h3 style="font-size:18px;margin:16px 0 4px">${t.g[g]}</h3>`+ITEMS.map((it,i)=>[it,i]).filter(([it])=>it.g==g).map(([it,i])=>`<div class="dish"><b>${it.n} – ${it.p} ${t.lei}</b><div class="sc">${[1,2,3,4,5].map(v=>`<button aria-label="${v}/5" onclick="rate(${i},${v})">${(S.sc[i]||0)>=v?'★':'☆'}</button>`).join('')}</div></div>`).join('')})}
 return hero+`<div class="sheet"><div class="top"><img class="lg" src="${LOGO}" alt="Energiea"></div><h2>${t.q}</h2><div class="bar"></div><p class="lead">${t.lead}</p>`+['exc','good','bad'].map(k=>`<button class="opt ${S.r==k?'on':''}" onclick="pick('${k}')">${t[k]}</button>`).join('')+dishes+
 `<textarea placeholder="${t.ph}" oninput="S.txt=this.value">${esc(S.txt)}</textarea><button class="btn" ${S.r?'':'disabled'} onclick="send()">${t.send}</button><p class="pw">${t.pw}</p></div>`}
function mgr(t){
 const n=S.rv.length,c=k=>S.rv.filter(r=>r.r==k).length,pos=Math.round((c('exc')+c('good'))/n*100),open=S.rv.filter(r=>r.r=='bad'&&!r.x).length,bars=[...S.day,pos];
 const list=S.rv.map((r,i)=>[r,i]).filter(([r])=>S.flt=='all'||r.r=='bad').map(([r,i])=>`<div class="rv ${r.x?'done':''}"><div class="t"><span class="tag ${r.r}">${t[r.r]}</span> · ${r.tb} · ${r.w}</div>${r.t?esc(r.t):'—'}${r.r=='bad'&&!r.x?`<br><button onclick="resolve(${i})">${t.res}</button>`:''}${r.x?`<br><small>✓ ${t.done}</small>`:''}</div>`).join('');
 const dish=S.tier==3?[...S.ds].sort((a,b)=>b.a-a.a).map(d=>`<div class="dr"><span>${d.n}</span><em><i style="width:${d.a*20}%"></i></em><b>${d.a}★</b></div>`).join(''):`<div class="lock">${t.lock}</div>`;
 return hero+`<div class="sheet"><div class="top"><img class="lg" src="${LOGO}" alt="Energiea"></div><h2>${t.sum}</h2><div class="bar"></div><div class="kp"><div><b>${pos}%</b><small>${t.pos}</small></div><div><b>${n}</b><small>${t.resp}</small></div><div><b>${open}</b><small>${t.att}</small></div></div>
 <h3>${t.days}</h3><div class="bars">${bars.map(v=>`<i style="height:${v}%"></i>`).join('')}</div><div class="lbl">${t.d.map(d=>`<span>${d}</span>`).join('')}</div>
 <h3>${t.dsh}</h3>${dish}
 <h3>${t.rev}</h3><div class="seg" style="margin-bottom:10px;width:max-content"><button class="${S.flt=='all'?'on':''}" onclick="flt('all')">${t.all}</button><button class="${S.flt=='bad'?'on':''}" onclick="flt('bad')">${t.neg}</button></div>${list}</div>`}
function draw(){const t=T[S.lang];document.documentElement.lang=S.lang;ctl(t);$('#app').innerHTML=S.view=='guest'?guest(t):mgr(t)}
draw();
</script>
</body>
</html>
